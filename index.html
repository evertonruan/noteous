<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('noteous-settings'));
        const luminosity = settings?.look?.luminosity;
        if (luminosity === 'dark' || luminosity === 'light') {
          const style = document.documentElement.style;
          style.setProperty('--hue', '45');
          style.setProperty('--saturation', '20%');
          style.setProperty('--lum-back', luminosity === 'dark' ? '4%' : '95%');
        }
      } catch (error) {
        console.error('Erro ao carregar a cor de fundo:', error);
      }
    </script>
    
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    
    <!--MATERIAL ICONS-->
    <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
    />
    <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
    rel="stylesheet"
    />
    <title>noteous preview</title>
    <meta name="description" content="Suas notas sempre à mão" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="noteous preview" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="noteous preview" />
    <meta property="og:description" content="Suas notas sempre à mão" />
    <meta property="og:url" content="https://preview.noteous.app/" />
    <meta property="og:image" content="https://preview.noteous.app/assets/images/social-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="./assets/icons/maskable-icon-preview-192.png">
  </head>
  <body id="index">
    <header>
      <nav>
        <h1 id="logo">noteous</h1>
        <div id="nav-options">
          <a id="nav-link" tabindex="7">• • • •</a>
        </div>
      </nav>
    </header>
    <main>
      <section id="section-write">
        <div id="info-panel" aria-live="polite" aria-atomic="true"></div>
        <div id="write-panel">
          <label id="write-label" for="write-input"></label>
          <div id="write-input-area">
            <button
              id="priority-button"
              type="button"
              tabindex="2"
              aria-label="Botão alterar prioridade da nota"
            ></button>
            <div id="write-input-wrapper">
              <div id="write-input-render"></div>
              <textarea
                id="write-input"
                type="text"
                tabindex="1"
                aria-label="Anotação"
                aria-describedby="write-label"
                placeholder="✏️ Anote aqui"
              ></textarea>
            </div>
          </div>
          <div id="write-buttons-container">
            <button
              id="write-button-add"
              class="write-buttons"
              type="button"
              aria-label="Adicionar nota"
              tabindex="3"
            >
              +
            </button>
            <button
            id="write-button-dismiss"
            class="write-buttons material-icons hidden-element"
            type="button"
            aria-label="Descartar nota"
            tabindex="4"
            >close</button>
          </div>
        </div>
      </section>
      <div id="orbs-list-container">
        <div id="orbs-list"></div>
        <p id="orbs-list-label">ORBS</p>
      </div>
      <section id="section-read">
        <div id="read-header">
        <div id="read-options">
          <div id="read-options-container">
            <p id="read-options-label">Opções de organização</p>
            <div id="read-options-actions-area">
              <div id="read-options-buttons-container">
              <button id="read-options-orientation" class="material-icons-outlined read-options-buttons" type="button" tabindex="6"></button>
              <button id="read-options-sort-action" class="material-icons read-options-buttons" type="button" tabindex="7"></button>
              <button id="read-options-sort" class="material-icons read-options-buttons" type="button" tabindex="8"></button>
            </div>
              <div id="read-options-menu" aria-live="polite"></div>
            </div>
          </div>
          <input type="search" name="read-options-search-input" id="read-options-search-input"
            placeholder="Buscar notas" tabindex="4"/>
        </div>
          <div id="orb-panel" role="button" tabindex="9" aria-controls="read-options" aria-expanded="false" aria-label="Mostrar opções de leitura">
            <p id="orb-panel-count"></p>
            <p id="orb-panel-label"></p>
            <span id="read-options-toggle" class="material-icons-outlined" aria-hidden="true">manage_search</span>
          </div>
        </div>
        <div id="read-panel">
          <div id="read-notes-container"></div>
        </div>
      </section>
    </main>

    <footer>
      <p id="noteous-version-label"><span></span></p>
    </footer>

    <script>
      let settings = JSON.parse(localStorage.getItem('noteous-settings') || '{}');

        if (settings) {

            let meta = document.querySelector('meta[name="theme-color"]')
            if (!meta) {
              meta = document.createElement('meta');
              meta.id = 'theme-color';
              meta.name = 'theme-color';
              
              if (settings?.look?.luminosity === 'dark') {
                meta.setAttribute('content', '#0C0B08')
                console.log(settings?.look?.luminosity)
              } else {
                console.log(settings?.look?.luminosity)
                meta.setAttribute('content', '#D6D1C2')
              }
              document.getElementsByTagName('head')[0].appendChild(meta);
            }
      
          let link = document.createElement('link');
          link.setAttribute('rel', 'manifest');
          link.setAttribute('href', 'manifest.json');
          document.getElementsByTagName('head')[0].appendChild(link);
    
          window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) };
          
          let script = document.createElement('script');
          script.setAttribute('defer', 'true');
          script.setAttribute('src', '/_vercel/insights/script.js');
          document.getElementsByTagName('body')[0].appendChild(script);

          window.si = window.si || function () { (window.siq = window.siq || []).push(arguments) };
          
          let script2 = document.createElement('script');
          script2.setAttribute('defer', 'true');
          script2.setAttribute('src', '/_vercel/speed-insights/script.js');
          document.getElementsByTagName('body')[0].appendChild(script2);
        }
    </script>

    <script type="module" src="index.js"></script>
  </body>
</html>
