<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />

        <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
        />

        <title>noteous • Galeria de Atualizações</title>
        <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
    </head>
    <body id="gallery">
        <header>
            <nav>
                    <div id="nav-container">
                    <a href="index.html" tabindex="1"><h1 id="logo">noteous</h1></a>
                    <h2>Galeria de Atualizações</h2>
                    <a id="nav-link" tabindex="3"><span class="material-icons">arrow_back</span></a>
                </div>
            </nav>
        </header>
        <main>
            <section id="gallery" class="about-section">
                <div id="gallery-banners-container">
                </div>
                <div id="banner-description"></div>
            </section>
        </main>

    <script>
      let settings = JSON.parse(localStorage.getItem('noteous-settings') || '{}');

        if (settings) {
          let link = document.createElement('link');
          link.setAttribute('rel', 'manifest');
          link.setAttribute('href', 'manifest.json');
          document.getElementsByTagName('head')[0].appendChild(link);
    
          window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) };
          
          let script = document.createElement('script');
          script.setAttribute('defer', 'true');
          script.setAttribute('src', '/_vercel/insights/script.js');
          document.getElementsByTagName('body')[0].appendChild(script);

          window.si = window.si || function () { (window.siq = window.siq || []).push(arguments) };
          
          let script2 = document.createElement('script');
          script2.setAttribute('defer', 'true');
          script2.setAttribute('src', '/_vercel/speed-insights/script.js');
          document.getElementsByTagName('body')[0].appendChild(script2);
        }
    </script>

        <script type="module" src="gallery.js"></script>
    </body>
</html>
